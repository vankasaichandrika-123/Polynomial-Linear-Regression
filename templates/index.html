<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Polynomial Regression</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Ultra&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body bgcolor="skyblue">

<div class="container text-center">

    <br>

    <h1>Polynomial Regression Salary Prediction</h1>

    <br>

    <form action="/predict" method="POST">

        <input
                type="number"
                step="0.1"
                name="Level"
                placeholder="Enter Position Level"
                required>

        <br><br>

        <button class="btn btn-success">
            Predict Salary
        </button>

    </form>

    <br>

    <h3>

        <strong>

            Predicted Salary :
            {{ prediction_text }}

        </strong>

    </h3>

    <br><br>

    <h2>Project By Saichandrika</h2>

    <h4>Data Scientist & Machine Learning</h4>

</div>

</body>

</html>
